<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="طلب نواقص الفروع — جاسمين بيوتي">
<meta name="robots" content="noindex">
<meta charset="utf-8">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>نواقص فروع جاسمين</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: a shelf of product cards under a sticky branch bar; a fixed basket bar at the bottom opens the review sheet. A second tab holds the purchasing board.
   Identity: Jasmine Beauty — navy #292663 for structure and selection, coral #E7634A for the main actions and counts. */
:root{
  --bg:#F4F4F8; --surface:#FFFFFF; --sunk:#EAEAF2; --line:#DCDCE7;
  --ink:#1E1D45; --muted:#5F5E7C;
  --accent:#292663; --accent-ink:#FFFFFF; --accent-soft:#E7E6F3;
  --jasmine:#E7634A; --jasmine-ink:#FFFFFF; --jasmine-soft:#FDEAE5;
  --danger:#C0392B; --ok:#2E7D4F;
  --font-display:"Poppins","Noto Sans Arabic",Tahoma,sans-serif;
  --font-body:"Noto Sans Arabic","Poppins",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121229; --surface:#1B1A38; --sunk:#25244A; --line:#36355E;
  --ink:#ECEBF8; --muted:#A4A3C4;
  --accent:#8F8BE3; --accent-ink:#121229; --accent-soft:#2A2858;
  --jasmine:#F07A63; --jasmine-ink:#1B0F0C; --jasmine-soft:#40252A;
  --danger:#F08A7A; --ok:#72CC93; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121229; --surface:#1B1A38; --sunk:#25244A; --line:#36355E;
  --ink:#ECEBF8; --muted:#A4A3C4;
  --accent:#8F8BE3; --accent-ink:#121229; --accent-soft:#2A2858;
  --jasmine:#F07A63; --jasmine-ink:#1B0F0C; --jasmine-soft:#40252A;
  --danger:#F08A7A; --ok:#72CC93; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--jasmine)}
.logo{flex:none;display:block;background:#FFFFFF;border-radius:8px;padding:4px 6px}
.logo img{display:block;height:36px;width:auto}
.brandmark .sep{width:1px;align-self:stretch;background:var(--line)}
.top .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:10px}
.brandmark svg{flex:none}
.brandmark h1{font-size:19px;font-weight:700}
.brandmark small{display:block;color:var(--muted);font-size:12.5px;font-family:var(--font-body)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.branches{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.branches::-webkit-scrollbar{display:none}
.bchip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.bchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bchip .n{font-size:11.5px;min-width:20px;padding:0 6px;border-radius:999px;background:var(--jasmine);color:var(--jasmine-ink);font-variant-numeric:tabular-nums}
.label{font-size:12px;color:var(--muted);letter-spacing:.02em}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 38px 9px 12px}
.search svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.brandsel{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;max-width:100%}
.onlycart{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);user-select:none}

main{padding-block:16px 120px}
.notice{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);text-align:center;background:var(--surface)}
.notice b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s}
.card.has{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.ph{aspect-ratio:1/1;max-width:100%;background:#fff;display:grid;place-items:center;border:0;padding:8px;position:relative}
.ph img{width:100%;height:100%;object-fit:contain}
.ph .noimg{color:#8A958F;font-size:12px;display:grid;gap:6px;justify-items:center}
.ph .qbadge{position:absolute;top:8px;left:8px;background:var(--jasmine);color:var(--jasmine-ink);font-weight:700;border-radius:999px;min-width:26px;height:26px;padding:0 7px;display:grid;place-items:center;font-variant-numeric:tabular-nums;font-size:13px}
.info{padding:10px 10px 4px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.info .br{font-size:11.5px;color:var(--accent);font-weight:600}
.info .nm{font-size:13.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.info .bc{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr;text-align:right;font-family:ui-monospace,Consolas,monospace}
.step{display:flex;align-items:center;gap:6px;padding:8px 10px 10px}
.step button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;line-height:1;display:grid;place-items:center;flex:none}
.step button.plus{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step input{flex:1;min-width:0;width:100%;height:36px;text-align:center;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600;font-variant-numeric:tabular-nums}

.basket{position:fixed;inset:auto 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.basket .wrap{padding-block:10px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.basket .sum{display:flex;flex-direction:column;min-width:0}
.basket .sum b{font-family:var(--font-display);font-size:16px;font-variant-numeric:tabular-nums}
.basket .sum span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:600;background:var(--jasmine);color:var(--jasmine-ink);display:inline-flex;gap:8px;align-items:center;justify-content:center;white-space:nowrap}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.wa{background:#1F9D55;color:#fff}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid currentColor}
.btn.sm{padding:7px 12px;font-size:13.5px}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,16,13,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:640px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.panel .hd{padding:16px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line)}
.panel .hd h2{font-size:18px}
.panel .hd p{margin:2px 0 0;color:var(--muted);font-size:13px}
.panel .bd{overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.panel .ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.panel .ft .btn{flex:1 1 150px}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;font-size:18px;flex:none}
.lines{display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.line img,.line .ni{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.line .t{min-width:0;font-size:13.5px}
.line .t small{display:block;color:var(--muted);direction:ltr;text-align:right;font-family:ui-monospace,Consolas,monospace;font-size:11px}
.line .q{font-weight:700;font-variant-numeric:tabular-nums;background:var(--jasmine-soft);border-radius:8px;padding:3px 10px}
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;width:100%}
.hint{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px);text-align:center}

/* Purchasing board */
.board{display:flex;flex-direction:column;gap:18px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px}
.tile h3{font-size:15px}
.tile .big{font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.zero .big{color:var(--muted)}
.section-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.section-h h2{font-size:17px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td.nm{white-space:normal;min-width:220px}
th{background:var(--sunk);font-weight:600;position:sticky;top:0}
td.num,th.num{text-align:center;font-variant-numeric:tabular-nums}
td.num.v{font-weight:700;background:var(--jasmine-soft)}
td.tot{font-weight:700;color:var(--accent)}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.order .oh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.order .oh b{font-family:var(--font-display);font-size:15.5px}
.order .meta{font-size:12.5px;color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.new{background:var(--jasmine-soft);color:var(--ink);border:1px solid var(--jasmine)}
.pill.done{background:var(--accent-soft);color:var(--ok)}
.order ul{margin:0;padding:0;list-style:none;font-size:13px;display:flex;flex-direction:column;gap:3px}
.order li{display:flex;justify-content:space-between;gap:10px}
.order li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order li span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.order .acts{display:flex;gap:6px;flex-wrap:wrap}
.order .note{font-size:13px;background:var(--sunk);border-radius:8px;padding:6px 10px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.info .nm{font-size:13px}.brandmark h1{font-size:16px}.logo img{height:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

    <div id="pickBranch" class="notice"><b>ابدئي باختيار الفرع</b> من الأعلى، ثم حددي كمية كل صنف ناقص.</div>
    <div id="grid" class="grid" style="margin-top:12px"></div>
    <div id="empty" class="notice" hidden>لا توجد أصناف بهذا البحث.</div>
  </section>
  <section id="view-board" class="board" hidden></section>
</main>

<div class="basket" id="basket">
  <div class="wrap">
    <div class="sum"><b id="sumTop">0 صنف · 0 قطعة</b><span id="sumSub">لم يتم اختيار فرع</span></div>
    <button class="btn" id="review" disabled>مراجعة وإرسال</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="hd"><div><h2 id="sheetTitle">طلب نواقص</h2><p id="sheetSub"></p></div><button class="x" id="closeSheet" aria-label="إغلاق">×</button></div>
    <div class="bd">
      <div class="field"><label class="label" for="pname">اسم البرموتر</label><input id="pname" placeholder="مثال: نورة" autocomplete="name"></div>
      <div class="lines" id="lines"></div>
      <div class="field"><label class="label" for="note">ملاحظة (اختياري)</label><textarea id="note" rows="2" placeholder="مثال: الصنف الأول مطلوب بشكل عاجل"></textarea></div>
      <div class="hint" id="sendHint"></div>
    </div>
    <div class="ft">
      <button class="btn" id="saveDb" hidden>حفظ الطلب في النظام</button>
      <a class="btn wa" id="sendWa" href="#" target="_blank" rel="noopener">إرسال عبر واتساب</a>
      <button class="btn ghost" id="copyTxt">نسخ الطلب</button>
      <button class="btn danger sm" id="clearCart" style="flex:0 0 auto">مسح الكل</button>
    </div>
  </div>
</div>
<div class="sheet" id="pinSheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pinTitle" style="max-width:420px">
    <div class="hd"><div><h2 id="pinTitle">رمز الفرع</h2><p id="pinSub"></p></div><button class="x" id="closePin" aria-label="إغلاق">×</button></div>
    <form class="bd" id="pinForm">
      <div class="field"><label class="label" for="pinInput" id="pinLabel">اكتبي الرمز السري</label><input id="pinInput" inputmode="numeric" autocomplete="off" maxlength="8" style="font-size:22px;text-align:center;letter-spacing:.3em;direction:ltr"></div>
      <div class="hint" id="pinErr" style="color:var(--danger)"></div>
      <button class="btn" type="submit" id="pinOk">دخول</button>
    </form>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
let BRANCHES = [];  // loaded from the sheet's الإعدادات tab
let P = [], PB = {};
const $ = id => document.getElementById(id);
// localStorage with an in-memory fallback, so PINs and baskets survive the visit even where storage is blocked
const memStore = {};
const ls = {
  get(k){ try { const v = localStorage.getItem('nw:' + k); if (v !== null) return v; } catch {} return k in memStore ? memStore[k] : null; },
  set(k, v){ memStore[k] = v; try { localStorage.setItem('nw:' + k, v); } catch {} }
};
const todayKey = () => new Date().toLocaleDateString('en-CA');
const fmtDate = d => new Date(d).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
const fmtTime = d => new Date(d).toLocaleString('ar-SA-u-ca-gregory-nu-latn', { day:'numeric', month:'short', hour:'numeric', minute:'2-digit' });
const norm = s => (s || '').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[ً-ْ]/g,'').replace(/\s+/g,' ');

let branch = '';
let carts = {};
const loadCarts = () => BRANCHES.forEach(b => { if (carts[b]) return; try { carts[b] = JSON.parse(ls.get('cart:' + b) || '{}'); } catch { carts[b] = {}; } });
const cart = () => carts[branch] || {};
const saveCart = () => ls.set('cart:' + branch, JSON.stringify(cart()));
let sheetUrl = '', orders = [], ordersReady = false, adminPin = ls.get('adminPin') || '', boardTimer = null;
const branchPin = b => ls.get('pin:' + b) || '';
const FN = { 'auth': 'auth', 'orders': 'submitOrder', 'admin/orders': 'adminOrders', 'admin/update': 'adminUpdate', 'admin/delete': 'adminDelete' };
const API_URL = 'https://script.google.com/macros/s/AKfycbzhypLGX6X1_Ui_OEy_yinxFZxohqI8p9oULMkA0Q20n8GRuYfZZVquoxZdjX8bYRqY/exec';
async function call(fn, body){
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn, body }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow' });
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
async function api(path, body){
  let r;
  try { r = await call(FN[path], body); }
  catch (e) { throw Object.assign(new Error(String(e && e.message || e)), { status: 0 }); }
  if (r && r.error) throw Object.assign(new Error(r.error), { status: r.status, code: r.error });
  return r;
}
// PIN prompt: resolves true when the server accepts the code
let pinCtx = null;
function askPin(kind, target){
  return new Promise(res => {
    pinCtx = { kind, target, res };
    $('pinTitle').textContent = kind === 'admin' ? 'رمز لوحة المشتريات' : `رمز فرع ${target}`;
    $('pinSub').textContent = kind === 'admin' ? 'خاص بمسؤول المشتريات' : 'الرمز يعطيك إياه المسؤول، ويُطلب مرة واحدة فقط على هذا الجوال';
    $('pinInput').value = ''; $('pinErr').textContent = '';
    $('pinSheet').hidden = false; setTimeout(() => $('pinInput').focus(), 50);
  });
}
function closePin(ok){ $('pinSheet').hidden = true; const c = pinCtx; pinCtx = null; c && c.res(ok); }
$('closePin').addEventListener('click', () => closePin(false));
$('pinForm').addEventListener('submit', async e => {
  e.preventDefault(); if (!pinCtx) return;
  const pin = $('pinInput').value.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim();
  if (!pin) return;
  $('pinOk').disabled = true;
  try {
    if (pinCtx.kind === 'admin'){ await api('auth', { admin: true, pin }); adminPin = pin; ls.set('adminPin', pin); }
    else { await api('auth', { branch: pinCtx.target, pin }); ls.set('pin:' + pinCtx.target, pin); }
    closePin(true);
  } catch (err) {
    $('pinErr').textContent = err.status === 429 ? 'محاولات كثيرة. انتظري ربع ساعة ثم حاولي مرة أخرى.' : err.status === 401 ? 'الرمز غير صحيح.' : 'تعذر الاتصال. تأكدي من الإنترنت.';
  } finally { $('pinOk').disabled = false; }
});

$('today').textContent = fmtDate(Date.now());
$('pname').value = ls.get('name') || '';
$('pname').addEventListener('input', e => ls.set('name', e.target.value.trim()));

// Branch chips
function renderBranches(){
  if (!BRANCHES.length){ $('branches').innerHTML = '<span class="hint">جاري تحميل الفروع…</span>'; return; }
  $('branches').innerHTML = BRANCHES.map(b => {
    const n = Object.keys(carts[b] || {}).length;
    return `<button class="bchip" aria-pressed="${b === branch}" data-b="${b}">${b}${n ? `<span class="n">${n}</span>` : ''}</button>`;
  }).join('');
}
$('branches').addEventListener('click', async e => {
  const btn = e.target.closest('.bchip'); if (!btn) return;
  const b = btn.dataset.b;
  if (!branchPin(b) && !(await askPin('branch', b))) return;
  branch = b; ls.set('branch', branch);
  renderBranches(); renderBasket(); loadProducts(b);
});

// Each branch has its own product list (a customer may carry only some items).
const productCache = {};
function loadProducts(b){
  const show = list => {
    if (b !== branch) return;
    P = list; PB = Object.fromEntries(P.map(p => [p.b, p]));
    P.forEach(p => p.key = norm(p.n + ' ' + p.br + ' ' + p.b));
    $('brand').value = ''; fillBrands(); renderGrid();
  };
  if (productCache[b]) return show(productCache[b]);
  P = []; PB = {}; renderGrid();
  call('getProducts', { branch: b })
    .then(list => { productCache[b] = list; show(list); })
    .catch(() => toast('تعذر تحميل الأصناف. حدّثي الصفحة.'));
}

// Brand filter
function fillBrands(){
  const brands = [...new Set(P.map(p => p.br))];
$('brand').innerHTML = `<option value="">كل البراندات (${P.length})</option>` + brands.map(b => `<option value="${b}">${b} (${P.filter(p => p.br === b).length})</option>`).join('');
}
['q','brand','onlyCart'].forEach(id => $(id).addEventListener('input', renderGrid));

const noImg = `<div class="noimg"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>بدون صورة</div>`;
function cardHTML(p){
  const q = cart()[p.b] || 0;
  return `<article class="card${q ? ' has' : ''}" data-b="${p.b}">
    <button class="ph" data-act="plus" aria-label="إضافة ${p.n}">${p.img ? `<img src="${p.img}" alt="" loading="lazy">` : noImg}<span class="qbadge"${q ? '' : ' hidden'}>${q}</span></button>
    <div class="info"><span class="br">${p.br}</span><span class="nm">${p.n}</span><span class="bc">${p.b}</span></div>
    <div class="step"><button data-act="minus" aria-label="إنقاص">−</button><input inputmode="numeric" aria-label="الكمية" id="q-${p.b}" value="${q || ''}" placeholder="0"><button class="plus" data-act="plus" aria-label="زيادة">+</button></div>
  </article>`;
}
function renderGrid(){
  $('pickBranch').hidden = !!branch;
  $('grid').hidden = !branch;
  if (!branch){ $('empty').hidden = true; return; }
  if (!P.length){ $('grid').innerHTML = '<div class="notice" style="grid-column:1/-1">جاري تحميل الأصناف…</div>'; $('empty').hidden = true; return; }
  const q = norm($('q').value.trim()), br = $('brand').value, only = $('onlyCart').checked;
  const list = P.filter(p => (!br || p.br === br) && (!q || p.key.includes(q)) && (!only || cart()[p.b]));
  $('grid').innerHTML = list.map(cardHTML).join('');
  $('empty').hidden = list.length > 0;
}
function setQty(code, q){
  q = Math.max(0, Math.min(9999, Math.floor(+q || 0)));
  if (q) cart()[code] = q; else delete cart()[code];
  saveCart();
  const card = $('grid').querySelector(`.card[data-b="${code}"]`);
  if (card){
    card.classList.toggle('has', !!q);
    const badge = card.querySelector('.qbadge'); badge.hidden = !q; badge.textContent = q;
    const inp = card.querySelector('input'); if (document.activeElement !== inp) inp.value = q || '';
  }
  renderBranches(); renderBasket();
}
$('grid').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]'); if (!btn || !branch) return;
  const code = btn.closest('.card').dataset.b, cur = cart()[code] || 0;
  setQty(code, cur + (btn.dataset.act === 'plus' ? 1 : -1));
});
$('grid').addEventListener('input', e => {
  if (e.target.tagName !== 'INPUT') return;
  e.target.value = e.target.value.replace(/[^\d٠-٩]/g,'').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  setQty(e.target.closest('.card').dataset.b, e.target.value);
});

function totals(c){ const ks = Object.keys(c); return { n: ks.length, qty: ks.reduce((s, k) => s + c[k], 0) }; }
function renderBasket(){
  const t = totals(cart());
  $('sumTop').textContent = `${t.n} صنف · ${t.qty} قطعة`;
  $('sumSub').textContent = branch ? `فرع ${branch}` : 'لم يتم اختيار فرع';
  $('review').disabled = !branch || !t.n;
}

// Review sheet
function orderText(){
  const c = cart(), t = totals(c), name = $('pname').value.trim(), note = $('note').value.trim();
  const rows = Object.keys(c).map((k, i) => `${i + 1}) ${PB[k]?.n || k}\n   باركود: ${k} — الكمية: ${c[k]}`);
  return [`*طلب نواقص — فرع ${branch}*`, `التاريخ: ${fmtDate(Date.now())}`, name ? `البرموتر: ${name}` : '', '', ...rows, '', `الإجمالي: ${t.n} صنف / ${t.qty} قطعة`, note ? `ملاحظة: ${note}` : ''].filter((l, i, a) => l !== '' || (a[i - 1] !== '' && i)).join('\n');
}
function refreshWa(){ $('sendWa').href = 'https://wa.me/?text=' + encodeURIComponent(orderText()); }
function openSheet(){
  const c = cart(), t = totals(c);
  $('sheetTitle').textContent = `طلب نواقص فرع ${branch}`;
  $('sheetSub').textContent = `${t.n} صنف · ${t.qty} قطعة`;
  $('lines').innerHTML = Object.keys(c).map(k => { const p = PB[k] || { n: k };
    return `<div class="line">${p.img ? `<img src="${p.img}" alt="">` : '<div class="ni"></div>'}<div class="t">${p.n}<small>${k}</small></div><span class="q">${c[k]}</span></div>`; }).join('');
  $('saveDb').hidden = false;
  $('sendWa').className = 'btn ghost'; $('sendWa').textContent = 'واتساب (احتياطي)';
  $('sendHint').textContent = 'اضغطي «حفظ الطلب في النظام» ليصل الطلب مباشرة للوحة المشتريات.';
  refreshWa();
  $('sheet').hidden = false;
}
$('review').addEventListener('click', openSheet);
$('closeSheet').addEventListener('click', () => $('sheet').hidden = true);
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) $('sheet').hidden = true; });
['pname','note'].forEach(id => $(id).addEventListener('input', refreshWa));
$('copyTxt').addEventListener('click', async () => {
  const txt = orderText();
  try { await navigator.clipboard.writeText(txt); toast('تم نسخ الطلب'); }
  catch {
    const ta = $('note'), old = ta.value; ta.value = txt; ta.select();
    toast('حددنا نص الطلب، انسخيه يدوياً ثم أعيدي الملاحظة');
    setTimeout(() => { ta.value = old; }, 15000);
  }
});
let clearArmed = false;
$('clearCart').addEventListener('click', () => {
  if (!clearArmed){ clearArmed = true; $('clearCart').textContent = 'تأكيد المسح'; setTimeout(() => { clearArmed = false; $('clearCart').textContent = 'مسح الكل'; }, 3000); return; }
  carts[branch] = {}; saveCart(); $('sheet').hidden = true; $('note').value = '';
  clearArmed = false; $('clearCart').textContent = 'مسح الكل';
  renderBranches(); renderGrid(); renderBasket(); toast('تم مسح طلب الفرع');
});
$('saveDb').addEventListener('click', async () => {
  const c = cart(), t = totals(c); if (!t.n) return;
  const btn = $('saveDb'); btn.disabled = true; btn.textContent = 'جاري الحفظ…';
  const doc = {
    branch, pin: branchPin(branch), promoter: $('pname').value.trim(), note: $('note').value.trim(),
    items: Object.keys(c).map(k => ({ b: k, n: PB[k]?.n || k, br: PB[k]?.br || '', q: c[k] })),
    date: todayKey()
  };
  try {
    await api('orders', doc);
    carts[branch] = {}; saveCart(); $('note').value = ''; $('sheet').hidden = true;
    renderBranches(); renderGrid(); renderBasket(); toast(`تم حفظ طلب فرع ${branch} ✓`);
  } catch (e) {
    if (e.status === 401){ ls.set('pin:' + branch, ''); $('sheet').hidden = true; toast('رمز الفرع تغيّر. اكتبي الرمز الجديد ثم أرسلي مرة أخرى.'); if (await askPin('branch', branch)) openSheet(); }
    else toast('تعذر الحفظ الآن. تأكدي من الإنترنت وحاولي مرة أخرى، أو أرسلي عبر واتساب.');
  } finally { btn.disabled = false; btn.textContent = 'حفظ الطلب في النظام'; }
});

let toastT;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }

// Tabs
function showTab(which){
  const board = which === 'board';
  $('tab-order').setAttribute('aria-selected', !board); $('tab-board').setAttribute('aria-selected', board);
  $('view-order').hidden = board; $('orderTools').style.display = board ? 'none' : 'flex';
  $('view-board').hidden = !board; $('basket').hidden = board;
  clearInterval(boardTimer);
  if (board){ renderBoard(); loadOrders(); boardTimer = setInterval(() => { if (!document.hidden) loadOrders(); }, 30000); }
}
$('tab-order').addEventListener('click', () => showTab('order'));
$('tab-board').addEventListener('click', () => showTab('board'));

// Purchasing board
let fRange = 'today', fStatus = 'new', delArmed = null;
function inRange(o){
  if (fRange === 'all') return true;
  if (fRange === 'today') return o.date === todayKey();
  const d = new Date(); d.setDate(d.getDate() - 6); return o.date >= d.toLocaleDateString('en-CA');
}
function boardOrders(){ return orders.filter(o => inRange(o) && (fStatus === 'all' || o.status === fStatus)); }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
function matrix(list){
  const m = {};
  list.forEach(o => (o.items || []).forEach(it => {
    const r = m[it.b] || (m[it.b] = { b: it.b, n: PB[it.b]?.n || it.n, br: PB[it.b]?.br || it.br, by: {}, tot: 0 });
    const q = Math.max(0, +it.q || 0); r.by[o.branch] = (r.by[o.branch] || 0) + q; r.tot += q;
  }));
  return Object.values(m).sort((a, b) => a.br.localeCompare(b.br, 'ar') || b.tot - a.tot);
}
function renderBoard(){
  const v = $('view-board');
  if (!adminPin){
    v.innerHTML = `<div class="notice"><b>لوحة المشتريات خاصة بالمسؤول.</b><br><button class="btn" id="adminLogin" style="margin-top:10px">إدخال رمز اللوحة</button></div>`;
    return;
  }
  if (!ordersReady){ v.innerHTML = `<div class="notice">جاري تحميل الطلبات…</div>`; return; }
  const list = boardOrders(), mx = matrix(list);
  const seg = (name, cur, opts) => `<div class="seg" data-seg="${name}">${opts.map(([k, l]) => `<button data-v="${k}" aria-pressed="${k === cur}">${l}</button>`).join('')}</div>`;
  const tiles = BRANCHES.map(b => {
    const os = list.filter(o => o.branch === b), q = os.reduce((s, o) => s + (+o.qty || 0), 0);
    const items = new Set(os.flatMap(o => (o.items || []).map(i => i.b))).size;
    return `<div class="tile${q ? '' : ' zero'}"><h3>${b}</h3><span class="big">${q}</span><span class="sub">قطعة · ${items} صنف · ${os.length} طلب</span></div>`;
  }).join('');
  const allQ = mx.reduce((s, r) => s + r.tot, 0);
  const table = mx.length ? `<div class="tbl"><table><thead><tr><th>الباركود</th><th>اسم الصنف</th><th>البراند</th>${BRANCHES.map(b => `<th class="num">${b}</th>`).join('')}<th class="num">الإجمالي</th></tr></thead><tbody>${
    mx.map(r => `<tr><td class="bc" style="direction:ltr;font-family:ui-monospace,Consolas,monospace;font-size:12px">${esc(r.b)}</td><td class="nm">${esc(r.n)}</td><td>${esc(r.br)}</td>${BRANCHES.map(b => `<td class="num${r.by[b] ? ' v' : ''}">${r.by[b] || ''}</td>`).join('')}<td class="num tot">${r.tot}</td></tr>`).join('')
  }<tr><th colspan="3">الإجمالي (${mx.length} صنف)</th>${BRANCHES.map(b => `<th class="num">${mx.reduce((s, r) => s + (r.by[b] || 0), 0) || ''}</th>`).join('')}<th class="num">${allQ}</th></tr></tbody></table></div>` : `<div class="notice">لا توجد طلبات في هذه الفترة.</div>`;
  const cards = list.map(o => `<article class="order" data-id="${esc(o.id)}">
      <div class="oh"><div><b>فرع ${esc(o.branch)}</b><div class="meta">${esc(o.promoter || 'بدون اسم')} · ${fmtTime(o.createdAt)}</div></div><span class="pill ${o.status === 'done' ? 'done' : 'new'}">${o.status === 'done' ? 'تم الشراء' : 'جديد'}</span></div>
      <ul>${(o.items || []).map(i => `<li><span>${esc(PB[i.b]?.n || i.n)}</span><span>${+i.q || 0}</span></li>`).join('')}</ul>
      ${o.note ? `<div class="note">${esc(o.note)}</div>` : ''}
      <div class="meta">${o.count} صنف · ${o.qty} قطعة</div>
      <div class="acts"><button class="btn sm ${o.status === 'done' ? 'ghost' : ''}" data-act="toggle">${o.status === 'done' ? 'إرجاع إلى جديد' : 'تم الشراء'}</button><button class="btn sm danger" data-act="del">${delArmed === o.id ? 'تأكيد الحذف' : 'حذف'}</button></div>
    </article>`).join('');
  v.innerHTML = `
    <div class="filters">${seg('range', fRange, [['today','اليوم'],['week','آخر 7 أيام'],['all','الكل']])}${seg('status', fStatus, [['new','جديد'],['done','تم الشراء'],['all','الكل']])}</div>
    <div class="tiles">${tiles}</div>
    <div class="section-h"><h2>جدول النواقص حسب الفرع</h2>${sheetUrl ? `<a class="btn sm ghost" href="${esc(sheetUrl)}" target="_blank" rel="noopener">فتح الطلبات في Google Sheet</a>` : ''}</div>
    ${table}
    <div class="section-h"><h2>الطلبات (${list.length})</h2></div>
    ${list.length ? `<div class="orders">${cards}</div>` : ''}`;
}
$('view-board').addEventListener('click', async e => {
  const sb = e.target.closest('.seg button');
  if (sb){ const s = sb.parentElement.dataset.seg; if (s === 'range') fRange = sb.dataset.v; else fStatus = sb.dataset.v; renderBoard(); return; }
  if (e.target.id === 'adminLogin'){ if (await askPin('admin')){ ordersReady = false; renderBoard(); loadOrders(); } return; }
  const ab = e.target.closest('[data-act]'); if (!ab) return;
  const id = ab.closest('.order').dataset.id, o = orders.find(x => x.id === id); if (!o) return;
  try {
    if (ab.dataset.act === 'toggle'){
      ab.disabled = true;
      await api('admin/update', { pin: adminPin, id, status: o.status === 'done' ? 'new' : 'done' });
    } else if (ab.dataset.act === 'del'){
      if (delArmed !== id){ delArmed = id; renderBoard(); setTimeout(() => { if (delArmed === id){ delArmed = null; renderBoard(); } }, 3000); return; }
      delArmed = null; await api('admin/delete', { pin: adminPin, id }); toast('تم حذف الطلب');
    }
    await loadOrders();
  } catch (err) {
    if (err.status === 401){ adminPin = ''; ls.set('adminPin', ''); renderBoard(); }
    else { toast('تعذر التحديث، حاول مرة أخرى'); ab.disabled = false; }
  }
});
async function loadOrders(){
  if (!adminPin) return;
  try {
    const j = await api('admin/orders', { pin: adminPin });
    orders = j.orders; sheetUrl = j.sheetUrl || ''; ordersReady = true;
  } catch (err) {
    if (err.status === 401){ adminPin = ''; ls.set('adminPin', ''); }
    else if (!ordersReady){ toast('تعذر تحميل الطلبات'); }
  }
  if (!$('view-board').hidden && !delArmed) renderBoard();
}
renderBranches(); renderGrid(); renderBasket();
if (new URLSearchParams(location.search).get('view') === 'board' || location.hash === '#board') showTab('board');
call('getBranches', {}).then(list => {
    BRANCHES = list; loadCarts();
    const saved = ls.get('branch');
    branch = BRANCHES.includes(saved) && branchPin(saved) ? saved : '';
    renderBranches(); renderBasket();
    if (branch) loadProducts(branch); else renderGrid();
    if (!$('view-board').hidden) renderBoard();
  }).catch(() => toast('تعذر تحميل الفروع. حدّثي الصفحة.'));
</script>
